[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true } # required:template
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
JUST_UNSTABLE = "1"

[tools]
age = "1.3.1"
cloudflared = "2026.8.2"
flux2 = "2.9.4"
gh = "2.97.0"
gum = "2.0.0"
helm = "4.2.4"
helmfile = "1.7.4"
jq = "1.8.2"
just = "1.58.0"
kubeconform = "0.8.0"
kubectl = "1.36.3"
kustomize = "5.8.1"
lefthook = "2.1.10"
sops = "3.13.3"
talhelper = "3.1.16"
talosctl = "1.13.9"
yq = "4.53.4"
zizmor = "1.29.0"

[hooks]
postinstall = "lefthook install"
