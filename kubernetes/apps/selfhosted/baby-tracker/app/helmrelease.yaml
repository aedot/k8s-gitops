---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: baby-tracker
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: baby-tracker
  values:
    controllers:
      baby-tracker:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/hms-homelab/baby-tracker
              tag: 2026.4.13@sha256:c357062132d599028b4f372a23e64b55a8b4a591fbf3e7b8e68e37154e78cdbd
            env:
              TZ: America/Los_Angeles
              FEED_HOURS: "3"
              FEVER_THRESHOLD_C: "38.0"
              FEVER_THRESHOLD_F: "100.4"
              SUMMARY_ENABLED: "true"
              SUMMARY_PROVIDER: ollama
              SUMMARY_HOSTED_URL: http://sys-mini-1.internal:11434
              SUMMARY_DAILY_CAP: "3"
              SUMMARY_HOUR: "8"
              MQTT_HOST: mosquitto.dbms.svc.cluster.local
              MQTT_PORT: "1883"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-db-app"
                    key: uri
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: 8099
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    # persistence:
    #   data:
    #     existingClaim: "{{ .Release.Name }}"
    #     advancedMounts:
    #       baby-tracker:
    #         app:
    #           - path: /data
