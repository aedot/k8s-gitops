---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: baby-tracker
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: baby-tracker
  values:
    controllers:
      baby-tracker:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/hms-homelab/baby-tracker
              tag: 2026.4.13@sha256:c357062132d599028b4f372a23e64b55a8b4a591fbf3e7b8e68e37154e78cdbd
            env:
              TZ: America/Los_Angeles
              feed_hours: "3"
              measurement_system: metrics
              hidden_modules: "['tab.get_ready', 'tab.contractions', 'pump.left', 'pump.right', 'feed.breast', 'feed.solid']"
              summary_enabled: "true"
              summary_provider: ollama
              summary_ollama_url: http://yemoja.internal:11434
              summary_daily_cap: "3"
              summary_hour: "8"
              mqtt_host: mosquitto.dbms.svc.cluster.local
              mqtt_port: "1883"
              database_url:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-db-app"
                    key: uri
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: 8099
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    # persistence:
    #   data:
    #     existingClaim: "{{ .Release.Name }}"
    #     advancedMounts:
    #       baby-tracker:
    #         app:
    #           - path: /data
