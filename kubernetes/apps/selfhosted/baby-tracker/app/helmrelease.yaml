---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: baby-tracker
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: baby-tracker
  values:
    controllers:
      baby-tracker:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/aedot/baby-tracker
              tag: 2026.4.15@sha256:099f843b03d863e539a1c4f4c3f94a993362f94e68b6cc61ffa5d0df96cea1b1
            env:
              TZ: America/Los_Angeles
              FEVER_THRESHOLD_C: "38.0"
              FEVER_THRESHOLD_F: "100.4"
              MEASUREMENT_SYSTEM: "metric"
              SUMMARY_ENABLED: "true"
              SUMMARY_WEEKLY_ENABLED: "true"
              SUMMARY_MONTHLY_ENABLED: "true"
              SUMMARY_HOUR: "23"
              SUMMARY_PROVIDER: ollama
              SUMMARY_OLLAMA_URL: http://sys-mini-1.internal:11434
              # Default is gpt-oss:120b-cloud (Ollama cloud) which sys-mini-1
              # rejects with 403 (cloud disabled). Pin a locally-installed model
              # that answers within llm.py's hard-coded 60s TIMEOUT (qwen3.5 is
              # too slow on sys-mini-1; phi4-mini responds in ~4s).
              SUMMARY_MODEL: phi4-mini
              SUMMARY_DAILY_CAP: "3"
              # Hide unused modules. Ids must be fully-qualified (see
              # HIDEABLE_MODULES in config.py); unknown ids are silently dropped.
              HIDDEN_MODULES: tab.get_ready,tab.contractions,group.pump,feed.breast
              MQTT_HOST: mosquitto.dbms.svc.cluster.local
              MQTT_PORT: "1883"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-db-app"
                    key: uri
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: 8099
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    # persistence:
    #   data:
    #     existingClaim: "{{ .Release.Name }}"
    #     advancedMounts:
    #       baby-tracker:
    #         app:
    #           - path: /data
