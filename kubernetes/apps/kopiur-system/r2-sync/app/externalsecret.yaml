---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: r2-rclone-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless
  target:
    name: r2-rclone-config-secret
    template:
      data:
        # ${CLOUDFLARE_ACCOUNT_ID} is Flux-substituted from cluster-secrets (postBuild);
        # {{ .AWS_* }} are ESO-rendered from the Akeyless `cloudflare` extract.
        rclone.conf: |
          [r2-kopia]
          type = s3
          provider = Cloudflare
          access_key_id = {{ .AWS_ACCESS_KEY_ID }}
          secret_access_key = {{ .AWS_SECRET_ACCESS_KEY }}
          endpoint = https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
          region = auto
  dataFrom:
    - extract:
        key: cloudflare
