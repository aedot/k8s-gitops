---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kopiur-r2-sync
spec:
  schedule: "0 5 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600 # 6 hours
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            # perfectra1n/volsync bundles kopia + rclone; used here purely as a toolbox.
            - name: kopiur-sync
              image: ghcr.io/perfectra1n/volsync:v0.17.11
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e -o pipefail

                  echo "Connecting to Kopia repository..."
                  kopia repository connect filesystem \
                    --password "$(printenv KOPIA_PASSWORD)" \
                    --path /repository

                  echo "Syncing to R2..."
                  kopia repository sync-to rclone \
                    --remote-path "r2-kopia:$(printenv KOPIA_BUCKET)" \
                    --parallel=4 \
                    --delete

                  echo "Disconnecting from Kopia repository..."
                  kopia repository disconnect

                  echo "Sync to Cloudflare R2 completed successfully"
              env:
                - name: KOPIA_CHECK_FOR_UPDATES
                  value: "false"
                - name: KOPIA_CACHE_DIR
                  value: /tmp/cache
                - name: HOME
                  value: /tmp
                - name: RCLONE_CONFIG
                  value: /config/rclone/rclone.conf
                # ${KOPIA_BUCKET} is Flux-substituted from cluster-secrets;
                # must match the R2 bucket name created in Cloudflare.
                - name: KOPIA_BUCKET
                  value: ${KOPIA_BUCKET}
              envFrom:
                - secretRef:
                    name: kopiur-nas-secret
              volumeMounts:
                - name: repository
                  mountPath: /repository
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: rclone-config
                  mountPath: /config/rclone
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                privileged: false
                capabilities: { drop: ["ALL"] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          volumes:
            - name: repository
              nfs:
                server: yemoja.internal
                path: /mnt/alaafin/k8s/kopiur
            - name: tmp
              emptyDir: {}
            - name: rclone-config
              secret:
                secretName: r2-rclone-config-secret
