---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: kopiur-s3
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-s3-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: yemoja.internal:9000
      region: us-west-1
      tls:
        disableTls: true
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  scheduleDefaults:
    timezone: America/Los_Angeles
  server:
    auth:
      insecure:
        acknowledgeInsecure: true
    namespace: kopiur-system
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: cloudflare-r2
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-r2-secret
          namespace: kopiur-system
      bucket: kopiur-q49c
      endpoint: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-r2-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  catalog:
    adoption: Ignore
  maintenance:
    enabled: true
    schedule:
      full:
        cron: 0 3 * * 1
      quick:
        cron: 0 6 * * *
  scheduleDefaults:
    timezone: America/Los_Angeles
  server:
    auth:
      insecure:
        acknowledgeInsecure: true
    namespace: kopiur-system
