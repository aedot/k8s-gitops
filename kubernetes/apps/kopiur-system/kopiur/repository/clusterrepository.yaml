---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: yemoja
spec:
  allowedNamespaces:
    all: true
  catalog:
    periodicRefresh: true
    retain:
      perIdentity: 0
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          path: /mnt/alaafin/k8s/kopiur
          server: yemoja.internal
    # s3:
    #   auth:
    #     secretRef:
    #       name: kopiur-repository-secret
    #       namespace: kopiur-system
    #   bucket: kopiur
    #   endpoint: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
    #   prefix: ""
  create:
    enabled: true
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-nas-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  moverDefaults:
    podSecurityContext:
      fsGroup: 1000
    securityContext:
      runAsGroup: 1000
      runAsUser: 1000
  parameters:
    epoch:
      minDuration: 6h
  scheduleDefaults:
    timezone: America/Los_Angeles
