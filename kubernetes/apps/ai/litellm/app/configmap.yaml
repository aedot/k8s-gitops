---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-configmap
data:
  config.yaml: |
    model_list:
      # Ollama
      - model_name: phi4-mini
        litellm_params:
          model: ollama/phi4-mini
          api_base: http://sys-mini-1.internal:11434
        model_info:
          mode: chat

      - model_name: qwen3.5:9b
        litellm_params:
          model: ollama/qwen-3.5
          api_base: http://sys-mini-1.internal:11434
        model_info:
          mode: chat

      - model_name: gemma4:e4b
        litellm_params:
          model: ollama/gemma4
          api_base: http://sys-mini-1.internal:11434
        model_info:
          mode: chat

    general_settings:
      health_check_endpoint: /v1/health
      store_model_in_db: false

    router_settings:
      routing_strategy: simple-shuffle
      cooldown_time: 30
      enable_pre_call_checks: true
      redis_host: os.environ/REDIS_HOST
      redis_port: os.environ/REDIS_PORT

    litellm_settings:
      success_callback: ["prometheus"]
      prometheus_adapter: true
      cache: true
      cache_params:
        type: redis
        host: os.environ/REDIS_HOST
        port: os.environ/REDIS_PORT
      drop_params: false
      request_timeout: 600
      num_retries: 2
      retry_after: 5
      set_verbose: false

    environment:
      - REDIS_HOST
      - REDIS_PORT
