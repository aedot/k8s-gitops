---
# Allow the kube-prometheus-stack Prometheus (in the observability namespace) to
# read the litellm master key so its ServiceMonitor can authenticate to the
# LiteLLM /metrics endpoint (v1.97.0 gates /metrics behind auth). Scoped to the
# single secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-litellm-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-litellm-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-litellm-secret-reader
subjects:
  - kind: ServiceAccount
    name: kube-prometheus-stack-prometheus
    namespace: observability
