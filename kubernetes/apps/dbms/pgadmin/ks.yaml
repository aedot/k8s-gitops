---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgadmin
spec:
  interval: 1h
  path: ./kubernetes/apps/dbms/pgadmin/app
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: cnpg-operator
    - name: kopiur
      namespace: kopiur-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: dbms
  wait: false
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: pgadmin
      KOPIUR_CLAIM: pgadmin-config
      KOPIUR_PUID: "5050"
      KOPIUR_PGID: "5050"
