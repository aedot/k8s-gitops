---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tracearr
spec:
  interval: 30m
  path: ./kubernetes/apps/media/tracearr/app
  components:
    # - ../../../../components/kopiur
    - ../../../../components/postgres
    - ../../../../components/dragonfly
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  dependsOn:
    - name: dragonfly
      namespace: dbms
    - name: akeyless-stores
      namespace: external-secrets
    - name: cnpg-barman-cloud
      namespace: dbms
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: tracearr
      # renovate: datasource=docker depName=timescale/timescaledb-ha
      PSQL_IMAGE: timescale/timescaledb-ha:pg18.3-ts2.25.2@sha256:416fe955f5d9aa42a5a1c273e63d6f6c3480faa9ca98171924ef09fa6315da5e
