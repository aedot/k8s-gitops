---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chartRef:
    kind: OCIRepository
    name: longhorn
  interval: 1h
  values:
    preUpgradeChecker:
      jobEnabled: false
      upgradeVersionCheck: false
    persistence:
      defaultDataLocality: best-effort
      recurringJobSelector:
        enable: true
        jobList: '[{"name":"recurring-fs-trim", "isGroup":false}]'
    defaultSettings:
      # V1 (iSCSI) data engine. Reverted from the V2/SPDK build, which hit a
      # v2 NVMe-TCP device-number-reuse race in Longhorn v1.12.0 (frontend flips
      # app ext4 read-only). Data disk is a filesystem userVolume at
      # /var/mnt/longhorn (talconfig.yaml + machine-nodelabel.yaml).
      v2DataEngine: false
      defaultDataEngine: v1
      defaultDataPath: "/var/mnt/longhorn"
      replicaDiskSoftAntiAffinity: false
      createDefaultDiskLabeledNodes: true
      defaultDataLocality: best-effort
      defaultLonghornStaticStorageClass: longhorn
      defaultReplicaCount: "3"
      guaranteedEngineManagerCPU: "20"
      guaranteedReplicaManagerCPU: "20"
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      orphanAutoDeletion: replica-data;instance
      # Conservative rebuild behavior: on a 3-node/3-replica cluster replicas are
      # already fully spread, so auto-balance is pure churn; serialize rebuilds to
      # limit disk/network pressure during recovery.
      replicaAutoBalance: disabled
      concurrentReplicaRebuildPerNodeLimit: "1"
      storageMinimalAvailablePercentage: "1"
      storageReservedPercentageForDefaultDisk: "10"
    ingress:
      enabled: false
    httproute:
      enabled: true
      hostnames:
        - "longhorn.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-internal
          namespace: network
    metrics:
      serviceMonitor:
        enabled: true
    # Longhorn 1.12.1 flipped the chart default to ship NetworkPolicies that only
    # allow ingress to longhorn-manager:9500 from other Longhorn pods, which drops
    # Prometheus scrapes from the observability namespace (TargetDown on
    # longhorn-backend). This cluster does not otherwise use netpols for isolation,
    # so pin the pre-1.12.1 behavior explicitly.
    networkPolicies:
      enabled: false
