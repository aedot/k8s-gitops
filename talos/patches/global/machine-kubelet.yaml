machine:
  kubelet:
    extraConfig:
      serializeImagePulls: false
      imageMaximumGCAge: 24h
    # No Longhorn bind-mount: V2 uses a raw block device, not a /var/mnt filesystem path.
    defaultRuntimeSeccompProfileEnabled: true
    nodeIP:
      validSubnets:
        - 172.24.20.0/24
    disableManifestsDirectory: true
